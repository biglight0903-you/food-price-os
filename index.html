<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Food & Price OS Ultimate Complete Edition
</title>

<meta name="theme-color" content="#27ae60">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<style>

body{
    font-family:sans-serif;
    background:#f4f7f6;
    margin:0;
    padding:20px;
    color:#333;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h1{
    color:#2c3e50;
    margin-top:0;
}

h2{
    margin-top:40px;
    border-left:6px solid #27ae60;
    padding-left:10px;
    color:#2c3e50;
}

input,
select,
button,
textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
    font-size:14px;
}

textarea{
    resize:vertical;
}

button{
    background:#27ae60;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.92;
}

.clear-btn{
    background:#e74c3c;
}

.result{
    margin-top:20px;
    padding:18px;
    border-radius:10px;
    background:#fff;
    border-left:8px solid #27ae60;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.good{
    border-left-color:#27ae60;
}

.normal{
    border-left-color:#f1c40f;
}

.bad{
    border-left-color:#e74c3c;
}

.ai-box{
    background:#eef7ff;
    border-left:8px solid #3498db;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#2c3e50;
    color:white;
}

.mode-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

#reader{
    width:100%;
    margin-top:20px;
}

.rank{
    display:inline-block;
    padding:4px 10px;
    border-radius:6px;
    color:white;
    font-weight:bold;
}

.rankS{ background:#27ae60; }
.rankA{ background:#2ecc71; }
.rankB{ background:#f1c40f; color:#333; }
.rankC{ background:#e67e22; }
.rankD{ background:#e74c3c; }

</style>

</head>

<body>

<div class="container">

<h1>
Food & Price OS Ultimate Complete Edition
</h1>

<p>
食品・栄養・AI・OCR・バーコード・価格比較統合OS
</p>

<!-- ================================= -->
<!-- モード -->
<!-- ================================= -->

<h2>① モード設定</h2>

<select id="mode">

<option>減量</option>
<option>維持</option>
<option>増量</option>

</select>

<!-- ================================= -->
<!-- 検索 -->
<!-- ================================= -->

<h2>② 食品検索</h2>

<input
type="text"
id="searchInput"
placeholder="オイコス / 鶏むね肉 / SAVAS">

<div class="mode-box">

<button onclick="searchItem()">
通常検索
</button>

<button onclick="aiFoodReview()">
Gemini AI評価
</button>

</div>

<div id="searchResult"></div>

<!-- ================================= -->
<!-- AI拡張 -->
<!-- ================================= -->

<h2>③ AI拡張</h2>

<div class="mode-box">

<button onclick="generateRecipe()">
AIレシピ生成
</button>

<button onclick="generateMealPlan()">
AI献立提案
</button>

</div>

<div class="mode-box" style="margin-top:10px;">

<button onclick="generateShoppingPlan()">
AI買い物最適化
</button>

<button onclick="searchOpenFoodFacts()">
OpenFoodFacts検索
</button>

</div>

<!-- ================================= -->
<!-- PFC -->
<!-- ================================= -->

<h2>④ PFC集計</h2>

<input
type="text"
id="pfcFood"
placeholder="食品名">

<input
type="number"
id="pfcAmount"
placeholder="数量">

<button onclick="addPFC()">
PFC追加
</button>

<div class="result">

<h3>現在合計</h3>

<p>
Protein:
<span id="totalP">0</span> g
</p>

<p>
Fat:
<span id="totalF">0</span> g
</p>

<p>
Carb:
<span id="totalC">0</span> g
</p>

<p>
Calories:
<span id="totalCalories">0</span> kcal
</p>

</div>

<!-- ================================= -->
<!-- OCR -->
<!-- ================================= -->

<h2>⑤ OCR / 画像解析</h2>

<input
type="file"
id="imageInput"
accept="image/*">

<div class="mode-box">

<button onclick="readOCR()">
OCR解析
</button>

<button onclick="analyzeFoodImage()">
Gemini画像解析
</button>

</div>

<!-- ================================= -->
<!-- Barcode -->
<!-- ================================= -->

<h2>⑥ バーコード</h2>

<button onclick="startBarcodeScanner()">
バーコード読み取り開始
</button>

<div id="reader"></div>

<!-- ================================= -->
<!-- 保存 -->
<!-- ================================= -->

<h2>⑦ 保存</h2>

<div class="mode-box">

<button onclick="saveMealHistory()">
履歴保存
</button>

<button onclick="loadMealHistory()">
履歴読込
</button>

</div>

<!-- ================================= -->
<!-- リセット -->
<!-- ================================= -->

<h2>⑧ リセット</h2>

<button
class="clear-btn"
onclick="clearAll()">

オールクリア

</button>

</div>

<!-- ================================= -->
<!-- Libraries -->
<!-- ================================= -->

<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>

<script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

<script>

/* =====================================
API KEY
===================================== */

// 自分のGemini APIキーを入れる

const API_KEY = "AIzaSyB_AROtYa2U15rlIwaW9IDzglmlqahJ1ac";

const MODEL = "gemini-2.5-flash";

/* =====================================
DB
===================================== */

const foodDB = [

{
name:"オイコス",
protein:12,
fat:0,
carb:7,
price:180,
rank:"S",
desc:"高タンパク低脂質"
},

{
name:"鶏むね肉",
protein:23,
fat:1,
carb:0,
price:78,
rank:"S",
desc:"減量最強"
},

{
name:"卵",
protein:6,
fat:5,
carb:0,
price:25,
rank:"A",
desc:"完全栄養"
},

{
name:"納豆",
protein:8,
fat:5,
carb:5,
price:40,
rank:"S",
desc:"発酵食品"
}

];

/* =====================================
Gemini
===================================== */

async function askGemini(prompt){

const response = await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,

{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[
{
parts:[
{
text:prompt
}
]
}
],

generationConfig:{
temperature:0.7,
maxOutputTokens:8192
}

})
}

);

const data = await response.json();

return data.candidates[0]
.content.parts[0].text;

}

/* =====================================
通常検索
===================================== */

window.searchItem = function(){

const keyword =
document.getElementById("searchInput")
.value
.toLowerCase();

const result =
foodDB.find(item =>
item.name.toLowerCase().includes(keyword)
);

const area =
document.getElementById("searchResult");

if(!result){

area.innerHTML = `
<div class="result bad">

<h2>未登録</h2>

<p>
OpenFoodFacts検索を試してください
</p>

</div>
`;

return;

}

area.innerHTML = `

<div class="result good">

<h2>${result.name}</h2>

<table>

<tr>
<th>P</th>
<td>${result.protein}g</td>
</tr>

<tr>
<th>F</th>
<td>${result.fat}g</td>
</tr>

<tr>
<th>C</th>
<td>${result.carb}g</td>
</tr>

<tr>
<th>価格</th>
<td>${result.price}円</td>
</tr>

<tr>
<th>ランク</th>
<td>
<span class="rank rank${result.rank}">
${result.rank}
</span>
</td>
</tr>

<tr>
<th>特徴</th>
<td>${result.desc}</td>
</tr>

</table>

</div>

`;

}

/* =====================================
AI評価
===================================== */

window.aiFoodReview = async function(){

const keyword =
document.getElementById("searchInput")
.value;

const mode =
document.getElementById("mode")
.value;

const area =
document.getElementById("searchResult");

area.innerHTML = `
<div class="result normal">
AI解析中...
</div>
`;

const prompt = `

食品「${keyword}」を
体づくりモード「${mode}」で
詳しく評価してください。

以下を含める:

・PFC
・コスパ
・おすすめ
・注意点
・ランク

HTML形式で見やすく出力。

`;

const result =
await askGemini(prompt);

area.innerHTML = `
<div class="result ai-box">
${result}
</div>
`;

}

/* =====================================
AIレシピ
===================================== */

window.generateRecipe = async function(){

const keyword =
document.getElementById("searchInput")
.value;

const result =
await askGemini(`

${keyword}を使った
高タンパクレシピを
HTML形式で3つ提案

`);

document.getElementById("searchResult")
.innerHTML = `
<div class="result ai-box">
${result}
</div>
`;

}

/* =====================================
AI献立
===================================== */

window.generateMealPlan = async function(){

const mode =
document.getElementById("mode")
.value;

const result =
await askGemini(`

${mode}向け
1日の献立を
HTML形式で作成

`);

document.getElementById("searchResult")
.innerHTML = `
<div class="result ai-box">
${result}
</div>
`;

}

/* =====================================
買い物最適化
===================================== */

window.generateShoppingPlan = async function(){

const mode =
document.getElementById("mode")
.value;

const result =
await askGemini(`

${mode}向け
高コスパ食材を
1週間分作成

HTML形式

`);

document.getElementById("searchResult")
.innerHTML = `
<div class="result ai-box">
${result}
</div>
`;

}

/* =====================================
OpenFoodFacts
===================================== */

window.searchOpenFoodFacts = async function(barcode=null){

const keyword =
barcode ||
document.getElementById("searchInput")
.value;

const response =
await fetch(
`https://world.openfoodfacts.org/api/v0/product/${keyword}.json`
);

const data =
await response.json();

const p = data.product;

if(!p){

document.getElementById("searchResult")
.innerHTML = `
<div class="result bad">
商品なし
</div>
`;

return;

}

document.getElementById("searchResult")
.innerHTML = `

<div class="result good">

<h2>
${p.product_name || "商品名不明"}
</h2>

<table>

<tr>
<th>カロリー</th>
<td>
${p.nutriments?.energy_kcal_100g || "-"}
kcal
</td>
</tr>

<tr>
<th>P</th>
<td>
${p.nutriments?.proteins_100g || "-"}g
</td>
</tr>

<tr>
<th>F</th>
<td>
${p.nutriments?.fat_100g || "-"}g
</td>
</tr>

<tr>
<th>C</th>
<td>
${p.nutriments?.carbohydrates_100g || "-"}g
</td>
</tr>

</table>

</div>

`;

}

/* =====================================
PFC
===================================== */

let totalP = 0;
let totalF = 0;
let totalC = 0;
let totalCalories = 0;

window.addPFC = function(){

const name =
document.getElementById("pfcFood")
.value;

const amount =
Number(
document.getElementById("pfcAmount")
.value
) || 1;

const result =
foodDB.find(item =>
item.name.includes(name)
);

if(!result){

alert("食品未登録");

return;

}

totalP += result.protein * amount;
totalF += result.fat * amount;
totalC += result.carb * amount;

totalCalories =
(totalP * 4) +
(totalF * 9) +
(totalC * 4);

document.getElementById("totalP")
.innerText = totalP.toFixed(1);

document.getElementById("totalF")
.innerText = totalF.toFixed(1);

document.getElementById("totalC")
.innerText = totalC.toFixed(1);

document.getElementById("totalCalories")
.innerText = totalCalories.toFixed(0);

}

/* =====================================
OCR
===================================== */

window.readOCR = async function(){

const file =
document.getElementById("imageInput")
.files[0];

if(!file){

alert("画像選択");

return;

}

const result =
await Tesseract.recognize(
file,
'jpn'
);

document.getElementById("searchResult")
.innerHTML = `
<div class="result ai-box">

<h2>OCR結果</h2>

<pre>
${result.data.text}
</pre>

</div>
`;

}

/* =====================================
Gemini画像解析
===================================== */

window.analyzeFoodImage = async function(){

const file =
document.getElementById("imageInput")
.files[0];

if(!file){

alert("画像選択");

return;

}

const reader = new FileReader();

reader.onload = async function(){

const base64 =
reader.result.split(',')[1];

const response =
await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,

{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[
{
parts:[

{
text:"画像を解析して食品名・カロリー・PFCを推定"
},

{
inlineData:{
mimeType:file.type,
data:base64
}
}

]
}
]

})
}

);

const data =
await response.json();

const text =
data.candidates[0]
.content.parts[0].text;

document.getElementById("searchResult")
.innerHTML = `
<div class="result ai-box">

<h2>画像解析結果</h2>

<div>
${text}
</div>

</div>
`;

};

reader.readAsDataURL(file);

}

/* =====================================
Barcode
===================================== */

window.startBarcodeScanner = async function(){

const reader =
document.getElementById("reader");

reader.innerHTML = "";

try{

const html5QrCode =
new Html5Qrcode("reader");

await html5QrCode.start(

{
facingMode:{
exact:"environment"
}
},

{
fps:10,
qrbox:{
width:250,
height:250
}
},

async(decodedText)=>{

await html5QrCode.stop();

document.getElementById("searchResult")
.innerHTML = `
<div class="result good">

<h2>バーコード検出</h2>

<p>${decodedText}</p>

</div>
`;

searchOpenFoodFacts(decodedText);

}

);

}catch(err){

console.error(err);

alert(
"HTTPS環境で起動してください"
);

}

}

/* =====================================
保存
===================================== */

window.saveMealHistory = function(){

const data = {

protein:totalP,
fat:totalF,
carb:totalC,
calories:totalCalories

};

localStorage.setItem(
"food_os_history",
JSON.stringify(data)
);

alert("保存完了");

}

window.loadMealHistory = function(){

const raw =
localStorage.getItem(
"food_os_history"
);

if(!raw){

alert("保存なし");

return;

}

const data =
JSON.parse(raw);

totalP = data.protein;
totalF = data.fat;
totalC = data.carb;
totalCalories = data.calories;

document.getElementById("totalP")
.innerText = totalP;

document.getElementById("totalF")
.innerText = totalF;

document.getElementById("totalC")
.innerText = totalC;

document.getElementById("totalCalories")
.innerText = totalCalories;

alert("読込完了");

}

/* =====================================
Clear
===================================== */

window.clearAll = function(){

if(confirm("リセットしますか？")){

location.reload();

}

}

/* =====================================
PWA
===================================== */

if('serviceWorker' in navigator){

window.addEventListener('load',()=>{

navigator.serviceWorker.register('./sw.js');

});

}

</script>

</body>
</html>
